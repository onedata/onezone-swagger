get:
  operationId: get_shared_data
  tags:
    - Share
  x-onedata-gri:
    type: od_share
    id: undefined
    aspect: "{shared_data, ?BINDING(file_id)}"
    scope: public
  summary: Get shared file or directory data
  x-bash-codegen-description: |
    This endpoint can be used to fetch publicly available information and
    content of a shared file or directory knowing its Id, without any
    authentication. It redirects to the corresponding REST endpoint in one of
    the supporting Oneproviders. The Oneprovider is chosen dynamically and may
    change in time, so the redirection URL should not be cached.

    The endpoint accepts only identifiers of shared files/directories and will
    reject requests if a containing share is deleted. The shared file/directory
    Id can be acquired either by fetching public share details or by listing a
    shared directory.

    The provided query string (if any) is preserved during redirection - consult
    corresponding Oneprovider REST endpoints for possible options.

    Currently, publicly available operations are:
    * `{...}/$FILE_ID/content` - download file or directory content
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/download_file_content))

    * `{...}/$FILE_ID/children` - list directory files and subdirectories
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/list_children))

    * `{...}/$FILE_ID` - get basic attributes of a file or directory
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/get_attrs))

    * `{...}/$FILE_ID/metadata/xattrs` - get custom extended attributes (xattrs) associated with a file or directory
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/get_xattrs))

    * `{...}/$FILE_ID/metadata/json` - get custom JSON metadata associated with a file or directory
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/get_json_metadata))

    * `{...}/$FILE_ID/metadata/rdf` - get custom RDF metadata associated with a file or directory
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/get_rdf_metadata))

    The endpoint will return `503 Service Unavailable` when there is no suitable
    Oneprovider to handle the request and `501 Not Implemented` when all available
    Oneproviders are in versions older than `20.02.*`. If an invalid subpath
    is requested, the target Oneprovider will respond with a proper error.
  description: |
    This endpoint can be used to fetch publicly available information and
    content of a shared file or directory knowing its Id, without any
    authentication. It redirects to the corresponding REST endpoint in one of
    the supporting Oneproviders. The Oneprovider is chosen dynamically and may
    change in time, so the redirection URL should not be cached.

    The endpoint accepts only identifiers of shared files/directories and will
    reject requests if a containing share is deleted. The shared file/directory
    Id can be acquired either by fetching public share details or by listing a
    shared directory.

    The provided query string (if any) is preserved during redirection - consult
    corresponding Oneprovider REST endpoints for possible options.

    Currently, publicly available operations are:
    * `{...}/$FILE_ID/content` - download file or directory content
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/download_file_content))

    * `{...}/$FILE_ID/children` - list directory files and subdirectories
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/list_children))

    * `{...}/$FILE_ID` - get basic attributes of a file or directory
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/get_attrs))

    * `{...}/$FILE_ID/metadata/xattrs` - get custom extended attributes (xattrs) associated with a file or directory
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/get_xattrs))

    * `{...}/$FILE_ID/metadata/json` - get custom JSON metadata associated with a file or directory
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/get_json_metadata))

    * `{...}/$FILE_ID/metadata/rdf` - get custom RDF metadata associated with a file or directory
      (see Oneprovider [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/get_rdf_metadata))

    The endpoint will return `503 Service Unavailable` when there is no suitable
    Oneprovider to handle the request and `501 Not Implemented` when all available
    Oneproviders are in versions older than `20.02.*`. If an invalid subpath
    is requested, the target Oneprovider will respond with a proper error.

    ***Example cURL requests***

    **Get shared file or directory data**
    ```bash
    curl -v -X GET https://$ZONE_HOST/api/v3/onezone/shares/data/$FILE_ID/content

    < HTTP/1.1 307 Temporary Redirect
    < location: https://provider.example.com/api/v3/oneprovider/data/$FILE_ID/content

    # -------------------------------------------------------------------------------

    curl -v -X GET https://$ZONE_HOST/api/v3/onezone/shares/data/$FILE_ID/children?limit=3

    < HTTP/1.1 307 Temporary Redirect
    < location: https://provider.example.com/api/v3/oneprovider/data/$FILE_ID/children?limit=3

    # -------------------------------------------------------------------------------

    # automatically follow redirects with -L option, request a byte range
    curl -L -X GET https://$ZONE_HOST/api/v3/onezone/shares/data/$FILE_ID/content \
    -H "Range: bytes=5-8"

    fghi
    ```
  produces:
    - application/json
  responses:
    '307':
      description: >
        Redirection to one of the supporting providers in the response `Location` header.
      headers:
        Location:
          description: URL of the endpoint that can be used to perform the operation.
          type: string
    '400':
      description: Invalid request.
      schema:
        $ref: '#/definitions/Error'
    '401':
      description: Authentication error.
      schema:
        $ref: '#/definitions/Error'
    '403':
      description: Authorization error.
      schema:
        $ref: '#/definitions/Error'
    '404':
      description: Resource not found.
      schema:
        $ref: '#/definitions/Error'
    '500':
      description: Internal server Error.
      schema:
        $ref: '#/definitions/Error'
    '501':
      description: Not Implemented - all available providers are in versions older than `20.02.*`.
      schema:
        $ref: '#/definitions/Error'
    '503':
      description: Service Unavailable - there is no suitable provider to handle the request.
      schema:
        $ref: '#/definitions/Error'
  parameters:
    - name: file_id
      in: path
      description: Shared file/directory Id.
      type: string
      required: true
    - name: subpath
      in: path
      description: |
        Subpath corresponding to desired
        [Oneprovider REST API](https://onedata.org/#/home/api/latest/oneprovider?anchor=tag/Basic-File-Operations)
        operation.
      type: string
      required: true
  x-code-samples:
    - lang: Shell
      source: "onezone-rest-cli getSharedData file_id=000000000055D4E4836803640004677569646D00 subpath='content'"


head:
  operationId: get_shared_data_info
  tags:
    - Share
  x-onedata-gri:
    type: od_share
    id: undefined
    aspect: "{shared_data, ?BINDING(file_id)}"
    scope: public
  summary: Get shared file or directory info
  x-bash-codegen-description: |
    HEAD counterpart of [Get shared file or directory data](#operation/get_shared_data).
    Redirects (in the same way as the GET variant) to the corresponding REST endpoint
    in one of the supporting Oneproviders, so that the request can be served without
    any authentication. The provided query string (if any) is preserved during redirection.

    In practice, HEAD is only meaningful for the `{...}/$FILE_ID/content` subpath and
    only for regular files, where it returns content headers such as `Content-Length`
    and `Accept-Ranges` (see the Oneprovider
    [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/get_file_content_headers)).
    It is not supported for directories, since the resulting TAR archive is created on
    the fly and its `Content-Length` cannot be determined up front.
  description: |
    HEAD counterpart of [Get shared file or directory data](#operation/get_shared_data).
    Redirects (in the same way as the GET variant) to the corresponding REST endpoint
    in one of the supporting Oneproviders, so that the request can be served without
    any authentication. The provided query string (if any) is preserved during redirection.

    In practice, HEAD is only meaningful for the `{...}/$FILE_ID/content` subpath and
    only for regular files, where it returns content headers such as `Content-Length`
    and `Accept-Ranges` (see the Oneprovider
    [REST endpoint](https://onedata.org/#/home/api/latest/oneprovider?anchor=operation/get_file_content_headers)).
    It is not supported for directories, since the resulting TAR archive is created on
    the fly and its `Content-Length` cannot be determined up front.

    The endpoint will return `503 Service Unavailable` when there is no suitable
    Oneprovider to handle the request and `501 Not Implemented` when all available
    Oneproviders are in versions older than `20.02.*`. If an invalid subpath
    is requested, the target Oneprovider will respond with a proper error.

    ***Example cURL requests***

    **Get shared file content headers**
    ```bash
    curl -v -I https://$ZONE_HOST/api/v3/onezone/shares/data/$FILE_ID/content

    < HTTP/1.1 307 Temporary Redirect
    < location: https://provider.example.com/api/v3/oneprovider/data/$FILE_ID/content

    # automatically follow redirects with -L option
    curl -L -I https://$ZONE_HOST/api/v3/onezone/shares/data/$FILE_ID/content

    HTTP/1.1 200 OK
    content-length: 15
    accept-ranges: bytes
    ```
  produces:
    - application/json
  responses:
