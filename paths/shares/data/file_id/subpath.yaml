      description: Invalid request.
      schema:
        $ref: '#/definitions/Error'
    '401':
      description: Authentication error.
      schema:
        $ref: '#/definitions/Error'
    '403':
      description: Authorization error.
      schema:
        $ref: '#/definitions/Error'
    '404':
      description: Resource not found.
      schema:
        $ref: '#/definitions/Error'
    '500':
      description: Internal server Error.
      schema:
        $ref: '#/definitions/Error'
    '501':
      description: Not Implemented - all available providers are in versions older than `20.02.*`.
      schema:
        $ref: '#/definitions/Error'
    '503':
      description: Service Unavailable - there is no suitable provider to handle the request.
      schema:
        $ref: '#/definitions/Error'
  parameters:
    - name: file_id
      in: path
      description: Shared file/directory Id.
      type: string
      required: true
    - name: subpath
      in: path
      description: |
        Subpath corresponding to desired
        [Oneprovider REST API](https://onedata.org/#/home/api/latest/oneprovider?anchor=tag/Basic-File-Operations)
        operation.
      type: string
      required: true
