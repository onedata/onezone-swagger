type: object
description: User create request.
properties:
  fullName:
    type: string
    description: User's full name (given names + surname). Defaults to `Unnamed User`.
  username:
    type: string
    description: >
      User's human-readable identifier, unique across the system. Makes it
      easier to identify the user and can be used for signing in with password.
      Defaults to null (no username).
  password:
    type: string
    description: >
      User's password (in plaintext). Typically used for admin accounts and users that
      cannot log in using an Identity Provider.
  linkedAccounts:
    type: array
    description: >
      The list of preconfigured linked accounts. May be useful to create a user
      account before they log in. Requires knowledge of at least the user's 
      subject ID in the IdP.
    items:
      $ref: '#/definitions/LinkedAccount'
example:
  fullName: Rudolf Lingens
  username: r.lingens
  password: lS1c6FD2mxB2ff
