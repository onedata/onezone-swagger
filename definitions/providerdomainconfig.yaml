type: object
description: Provider's domain config.
properties:
  subdomainDelegation:
    description: >
      True if this Oneprovider has been assigned a subdomain in Onezone's domain.
    type: boolean
  domain:
    description: >
      The fully qualified domain name of the Oneprovider. In rare cases, the
      domain may have the form of an IP address instead of an FQDN.
    type: string
  subdomain:
    description: >
      Unique subdomain in Onezone's domain for the Oneprovider.
      Applicable if subdomain delegation is enabled, null otherwise.
    type: string
  ipList:
    description: >
      The list of IP addresses advertised by Onezone on behalf of the Oneprovider.
      Applicable if subdomain delegation is enabled, empty list otherwise.
    type: array
    items:
      type: string
  ips:
    type: object
    description: A map of Oneprovider services and their corresponding IP addresses.
    additionalProperties:
      type: array
      items:
        type: string
        description: >
          The list of service IP addresses advertised by Onezone on behalf of the Oneprovider.
          Applicable if subdomain delegation is enabled.
example:
  subdomainDelegation: true
  domain: provider1.onezone.example.com
  subdomain: provider1
  ipList: ["172.17.0.1", "172.17.0.2", "172.17.0.3"]
  ips:
    "": ["172.17.0.1", "172.17.0.2", "172.17.0.3"]
    "s3": ["172.17.0.3", "172.17.0.4"]
